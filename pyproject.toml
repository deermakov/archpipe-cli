[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "archpipe-cli"
version = "0.1.0"
description = "Generate architecture artifacts (C4, PlantUML, ArchiMate) from HLD IR blocks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Architecture Team" }
]
dependencies = [
  "click>=8.1.0",
  "pydantic>=2.5.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
  "rich>=13.7.0",
  "watchdog>=4.0.0",
  "structurizr-python>=0.6.0,<0.7.0",
  "plantuml>=0.3.0",
  "pyarchimate>=0.1.0",
  "openai>=1.12.0",
  "anthropic>=0.18.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "black>=24.1.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0"
]

[project.scripts]
archpipe = "archpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archpipe"]

[tool.hatch.build.targets.sdist]
include = [
  "src/archpipe",
  "README.md",
  "IR_GUIDE.md",
  "archpipe",
  "scripts",
  "docker",
  "docker-compose.yml",
  "pyproject.toml"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["archpipe"]
